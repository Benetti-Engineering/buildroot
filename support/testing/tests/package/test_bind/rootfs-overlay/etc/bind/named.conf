//
// BIND configuration file for Buildroot runtime test.
//

options {
	directory "/tmp";
	pid-file none;
	listen-on { 127.0.0.1; };
	listen-on-v6 { none; };
	recursion no;
	dnssec-validation no;
	allow-query { any; };
};

zone "buildroot.test" {
	type primary;
	file "/etc/bind/db.buildroot.test";
};

zone "10.in-addr.arpa" {
	type primary;
	file "/etc/bind/db.10";
};
